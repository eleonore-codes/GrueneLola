    function showTask() { var options; var i; currentTask = round[position]; attemptsThisTask = 0; helpLevel = 0; answered = false; updateProgress(); card.innerHTML = '<div class="task-head"><div class="station-number">' + currentTask.station + '</div><div><div class="station-name">' + escapeHtml(currentTask.stationName) + '</div><div class="instruction">Aufgabe ' + (position + 1) + ' von ' + round.length + '</div></div></div><div class="question">' + escapeHtml(currentTask.question) + '</div><div class="focus">' + currentTask.display + '</div><div class="help-box" id="helpBox" aria-live="polite"></div><div class="options" id="optionsBox"></div><div class="feedback" id="feedbackBox" aria-live="polite"></div><div class="help-row"><button class="help-btn" id="helpBtn" type="button">Hilfe 1</button><button class="help-btn" id="newBtn" type="button">Neue Aufgabe</button></div><button class="main-btn" id="nextBtn" type="button" disabled>Weiter</button>'; options = shuffle(currentTask.options); for (i = 0; i < options.length; i += 1) { makeOption(options[i]); } document.getElementById('helpBtn').addEventListener('click', showHelp); document.getElementById('newBtn').addEventListener('click', replaceTask); document.getElementById('nextBtn').addEventListener('click', nextTask); }
    function choose(event) { var button = event.currentTarget; var value = button.getAttribute('data-value'); var feedback = document.getElementById('feedbackBox'); var buttons; var i; var stat; if (answered) { return; } attemptsThisTask += 1; if (value === currentTask.answer) { answered = true; button.className += ' correct'; stat = getStat(sessionStats, currentTask.competency); stat.attempts += 1; if (attemptsThisTask === 1 && helpLevel === 0) { stat.direct += 1; feedback.innerHTML = 'Richtig. ' + escapeHtml(competencies[currentTask.competency]) + ' klappt hier schon gut.'; } else { stat.helped += 1; feedback.innerHTML = 'Geschafft. Richtig ist: <strong>' + escapeHtml(currentTask.answer) + '</strong>'; } scheduleReview(); buttons = document.getElementById('optionsBox').getElementsByTagName('button'); for (i = 0; i < buttons.length; i += 1) { buttons[i].disabled = true; } document.getElementById('nextBtn').disabled = false; document.getElementById('helpBtn').disabled = true; } else { button.className += ' wrong'; button.disabled = true; feedback.innerHTML = attemptsThisTask === 1 ? 'Noch nicht. Nutze eine Hilfe oder tippe eine andere Kachel.' : 'Schau auf Zeitwort und Verbteile. Die Kacheln zeigen nur richtige Formen.'; if (attemptsThisTask >= 2) { getStat(sessionStats, currentTask.competency).uncertain += 1; } } }
    function scheduleReview() { var alternatives = []; var i; if ((attemptsThisTask < 2 && helpLevel < 2) || reviewScheduled[currentTask.competency]) { return; } for (i = 0; i < tasks.length; i += 1) { if (tasks[i].competency === currentTask.competency && tasks[i].id !== currentTask.id) { alternatives.push(tasks[i]); } } if (alternatives.length) { round.splice(Math.min(position + 2, round.length), 0, alternatives[Math.floor(Math.random() * alternatives.length)]); reviewScheduled[currentTask.competency] = true; } }
    function showHelp() { var box = document.getElementById('helpBox'); var button = document.getElementById('helpBtn'); helpLevel += 1; box.className = 'help-box show'; if (helpLevel === 1) { box.innerHTML = '<strong>Struktur:</strong> ' + escapeHtml(currentTask.help1); button.innerHTML = 'Hilfe 2'; } else if (helpLevel === 2) { box.innerHTML = '<strong>Denkfrage:</strong> ' + escapeHtml(currentTask.help2); button.innerHTML = 'Hilfe 3'; } else { helpLevel = 3; box.innerHTML = '<strong>Erster Schritt:</strong> ' + escapeHtml(currentTask.help3); button.disabled = true; } }
    function replaceTask() { var alternatives = []; var i; for (i = 0; i < tasks.length; i += 1) { if (tasks[i].competency === currentTask.competency && tasks[i].id !== currentTask.id) { alternatives.push(tasks[i]); } } if (alternatives.length) { round[position] = alternatives[Math.floor(Math.random() * alternatives.length)]; } showTask(); }
    function nextTask() { position += 1; if (position >= round.length) { finishRound(); } else { showTask(); } }
    function mergeStats() { var key; var source; var target; for (key in sessionStats) { if (sessionStats.hasOwnProperty(key)) { source = sessionStats[key]; target = getStat(savedStats, key); target.attempts += source.attempts; target.direct += source.direct; target.helped += source.helped; target.uncertain += source.uncertain; } } saveObject(STORAGE_KEY, savedStats); }
    function finishRound() { var good = ''; var practice = ''; var key; var stat; mergeStats(); progressFill.style.width = '100%'; for (key in sessionStats) { if (sessionStats.hasOwnProperty(key)) { stat = sessionStats[key]; if (stat.direct >= 2 && stat.uncertain === 0) { good += '<div class="summary-item">' + escapeHtml(competencies[key]) + '</div>'; } else { practice += '<div class="summary-item">' + escapeHtml(competencies[key]) + '</div>'; } } } if (!good) { good = '<div class="summary-item">Du hast die Runde ruhig zu Ende gebracht.</div>'; } if (!practice) { practice = '<div class="summary-item">In dieser Runde ist keine Kompetenz offen.</div>'; } card.innerHTML = '<h1 class="final-title">Lernraupe geschafft</h1><p class="lead">Dein Lernweg wird nach Kompetenzen geordnet.</p><section class="summary-group"><h2>Das klappt schon gut</h2>' + good + '</section><section class="summary-group"><h2>Das übe ich noch</h2>' + practice + '</section><p class="saved-note">Der Lernstand bleibt nur auf diesem Gerät.</p><button class="main-btn" id="repeatBtn" type="button">Neue gemischte Runde</button><button class="help-btn" id="menuBtn" type="button">Zur Kapitel-Auswahl</button>'; document.getElementById('repeatBtn').addEventListener('click', startScreen); document.getElementById('menuBtn').addEventListener('click', function () { window.location.href = 'index.html'; }); }
    function setReading(enabled) { document.documentElement.className = enabled ? 'reading' : ''; readBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false'); readBtn.innerHTML = enabled ? 'Lesehilfe an' : 'Lesehilfe'; saveObject(READING_KEY, { enabled: enabled }); }
    backBtn.addEventListener('click', function () { window.location.href = 'index.html'; });
    readBtn.addEventListener('click', function () { setReading(readBtn.getAttribute('aria-pressed') !== 'true'); });
    setReading(loadObject(READING_KEY).enabled === true);
    startScreen();
}());
