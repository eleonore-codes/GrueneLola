var card=document.getElementById('card'),fill=document.getElementById('fill'),read=document.getElementById('read'),round=[],pos=0,cur,tries,level,stats={},scheduled={};function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):{};}catch(e){return {};}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){return;}}function mix(a){var c=a.slice(0),i,j,x;for(i=c.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=c[i];c[i]=c[j];c[j]=x;}return c;}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function stat(k){if(!stats[k])stats[k]={attempts:0,direct:0,helped:0,uncertain:0};return stats[k];}
