    function setReading(enabled) { document.documentElement.className = enabled ? 'reading' : ''; readBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false'); readBtn.innerHTML = enabled ? 'Lesehilfe an' : 'Lesehilfe'; saveObject(READING_KEY, { enabled: enabled }); }
    backBtn.addEventListener('click', function () { window.location.href = 'index.html'; });
