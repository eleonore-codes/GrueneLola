var card=document.getElementById('card'),fill=document.getElementById('fill'),read=document.getElementById('read'),round=[],pos=0,mode='',answers=[],level=0;function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):{};}catch(e){return {};}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){return;}}function mix(a){var c=a.slice(0),i,j,x;for(i=c.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=c[i];c[i]=c[j];c[j]=x;}return c;}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function menu(){fill.style.width='0%';card.innerHTML='<h1>Klassenarbeit 3</h1><p class="lead">Satzglieder · Redewendungen · Merksprüche</p><div class="notice"><strong>Gewichtung:</strong> etwa 70 % Satzglieder und 30 % Sprachbilder.</div><div class="modes"><button class="mode" data-mode="practice">ÜBEN<small>Sofortiges Feedback und Hilfe</small></button><button class="mode" data-mode="exam">PROBE-KLASSENARBEIT<small>Auswertung erst am Ende</small></button><button class="mode" data-mode="print">PDF-ÜBUNG ERSTELLEN<small>Druckansicht mit Lösungsblatt</small></button></div>';var b=card.getElementsByTagName('button'),i;for(i=0;i<b.length;i++)b[i].addEventListener('click',select);}
function select(e){mode=e.currentTarget.getAttribute('data-mode');if(mode==='print'){printSheet();window.print();return;}round=build();pos=0;answers=[];show();}function build(){var a=[],keys=['subject','predicate','objects','details','blocks','idioms','sayings'],i,j,p;for(i=0;i<keys.length;i++){p=mix(bank.filter(function(q){return q[1]===keys[i];}));for(j=0;j<weights[keys[i]];j++)a.push(p[j%p.length]);}return mix(a);}
function show(){var q=round[pos],o=mix(q[5]),i,b;level=0;fill.style.width=Math.round(pos/round.length*100)+'%';card.innerHTML='<div class="head"><div class="num">'+(pos+1)+'</div><div><div class="area">'+esc(q[2])+'</div>Aufgabe '+(pos+1)+' von '+round.length+'</div></div><div class="question">'+esc(q[3])+'</div><div class="focus">'+q[4]+'</div><div class="hint" id="hint"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div>'+(mode==='practice'?'<div class="help-row"><button class="help" id="help">Hilfe 1</button><button class="help" id="new">Andere Aufgabe</button></div>':'<div class="notice">Keine Hilfe. Die Auswertung kommt am Ende.</div>')+'<button class="main" id="next" disabled>Weiter</button>';for(i=0;i<o.length;i++){b=document.createElement('button');b.className='option';b.setAttribute('data-v',o[i]);b.innerHTML=esc(o[i]);b.addEventListener('click',answer);document.getElementById('options').appendChild(b);}if(mode==='practice'){document.getElementById('help').addEventListener('click',hint);document.getElementById('new').addEventListener('click',replace);}document.getElementById('next').addEventListener('click',next);}
function answer(e){var q=round[pos],v=e.currentTarget.getAttribute('data-v'),all=document.getElementById('options').getElementsByTagName('button'),i;answers[pos]={skill:q[1],right:v===q[6]};if(mode==='practice'){if(v===q[6]){e.currentTarget.className+=' correct';document.getElementById('feedback').innerHTML='Richtig: <strong>'+esc(q[6])+'</strong>';for(i=0;i<all.length;i++)all[i].disabled=true;document.getElementById('next').disabled=false;}else{e.currentTarget.className+=' wrong';e.currentTarget.disabled=true;document.getElementById('feedback').innerHTML='Noch nicht. Nutze eine Hilfe.';}}else{for(i=0;i<all.length;i++)all[i].disabled=true;document.getElementById('feedback').innerHTML='Antwort gespeichert.';document.getElementById('next').disabled=false;}}
function hint(){var q=round[pos],box=document.getElementById('hint'),b=document.getElementById('help');level++;box.className='hint show';if(level===1){box.innerHTML='<strong>Struktur:</strong> '+esc(q[7]);b.innerHTML='Hilfe 2';}else if(level===2){box.innerHTML='<strong>Denkfrage:</strong> '+esc(q[8]);b.innerHTML='Hilfe 3';}else{box.innerHTML='<strong>Erster Schritt:</strong> '+esc(q[9]);b.disabled=true;}}function replace(){var q=round[pos],p=bank.filter(function(x){return x[1]===q[1]&&x[0]!==q[0];});if(p.length)round[pos]=p[Math.floor(Math.random()*p.length)];show();}function next(){pos++;if(pos>=round.length)finish();else show();}
function finish(){var r={},i,a,good='',practice='';fill.style.width='100%';for(i=0;i<answers.length;i++){a=answers[i];if(!r[a.skill])r[a.skill]={right:0,total:0};r[a.skill].total++;if(a.right)r[a.skill].right++;}for(i in r)if(r.hasOwnProperty(i)){if(r[i].right>=Math.ceil(r[i].total*.7))good+='<div class="item">'+esc(labels[i])+'</div>';else practice+='<div class="item">'+esc(labels[i])+'</div>';}if(!good)good='<div class="item">Du hast alles bearbeitet.</div>';if(!practice)practice='<div class="item">Keine Kompetenz ist offen.</div>';card.innerHTML='<h1>Auswertung</h1><h2>Das klappt schon gut</h2>'+good+'<h2>Das übe ich noch</h2>'+practice+'<button class="main" id="again">Neue Variante</button><button class="help" id="menu">Zur Auswahl</button>';document.getElementById('again').addEventListener('click',function(){round=build();pos=0;answers=[];show();});document.getElementById('menu').addEventListener('click',menu);}
