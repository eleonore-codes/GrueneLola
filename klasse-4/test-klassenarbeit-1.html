var weights={cases:4,strong:3,tense:3,perfect:2,nouns:1,personal:1,future:1};var card=document.getElementById('card'),fill=document.getElementById('fill'),read=document.getElementById('read'),round=[],pos=0,mode='',answers=[],tries=0,level=0;
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):{};}catch(e){return {};}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){return;}}function mix(a){var c=a.slice(0),i,j,x;for(i=c.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));x=c[i];c[i]=c[j];c[j]=x;}return c;}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function menu(){fill.style.width='0%';card.innerHTML='<h1>Klassenarbeit 1</h1><p class="lead">Nomen · Verben · Zeitformen</p><div class="notice"><strong>Schwerpunkte:</strong> Vier Fälle, starke Verben und Zeitformen.</div><div class="modes"><button class="mode" data-mode="practice">ÜBEN<small>Sofortiges Feedback und Hilfe</small></button><button class="mode" data-mode="exam">PROBE-KLASSENARBEIT<small>Auswertung erst am Ende</small></button><button class="mode" data-mode="print">PDF-ÜBUNG ERSTELLEN<small>Druckansicht mit Lösungsblatt</small></button></div>';var b=card.getElementsByTagName('button'),i;for(i=0;i<b.length;i++)b[i].addEventListener('click',chooseMode);}
function chooseMode(e){mode=e.currentTarget.getAttribute('data-mode');if(mode==='print'){buildPrint();window.print();return;}round=buildRound();pos=0;answers=[];show();}function buildRound(){var a=[],keys=['cases','strong','tense','perfect','nouns','personal','future'],i,j,pool;for(i=0;i<keys.length;i++){pool=mix(bank.filter(function(q){return q[1]===keys[i];}));for(j=0;j<weights[keys[i]];j++)a.push(pool[j%pool.length]);}return mix(a);}
function show(){var q=round[pos],o=mix(q[5]),i,b;tries=0;level=0;fill.style.width=Math.round(pos/round.length*100)+'%';card.innerHTML='<div class="head"><div class="num">'+(pos+1)+'</div><div><div class="area">'+esc(q[2])+'</div>Aufgabe '+(pos+1)+' von '+round.length+'</div></div><div class="question">'+esc(q[3])+'</div><div class="focus">'+q[4]+'</div><div class="hint" id="hint"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div>'+(mode==='practice'?'<div class="help-row"><button class="help" id="help">Hilfe 1</button><button class="help" id="new">Andere Aufgabe</button></div>':'<div class="notice">Keine Hilfe im Probe-Modus. Die Auswertung kommt am Ende.</div>')+'<button class="main" id="next" disabled>Weiter</button>';for(i=0;i<o.length;i++){b=document.createElement('button');b.className='option';b.setAttribute('data-v',o[i]);b.innerHTML=esc(o[i]);b.addEventListener('click',answer);document.getElementById('options').appendChild(b);}if(mode==='practice'){document.getElementById('help').addEventListener('click',hint);document.getElementById('new').addEventListener('click',replace);}document.getElementById('next').addEventListener('click',next);}
function answer(e){var q=round[pos],v=e.currentTarget.getAttribute('data-v'),all=document.getElementById('options').getElementsByTagName('button'),i;tries++;answers[pos]={skill:q[1],right:v===q[6],chosen:v,answer:q[6]};if(mode==='practice'){if(v===q[6]){e.currentTarget.className+=' correct';document.getElementById('feedback').innerHTML='Richtig: <strong>'+esc(q[6])+'</strong>';for(i=0;i<all.length;i++)all[i].disabled=true;document.getElementById('next').disabled=false;}else{e.currentTarget.className+=' wrong';e.currentTarget.disabled=true;document.getElementById('feedback').innerHTML='Noch nicht. Nutze eine Hilfe oder eine andere Kachel.';}}else{for(i=0;i<all.length;i++)all[i].disabled=true;document.getElementById('feedback').innerHTML='Antwort gespeichert.';document.getElementById('next').disabled=false;}}
function hint(){var q=round[pos],box=document.getElementById('hint'),b=document.getElementById('help');level++;box.className='hint show';if(level===1){box.innerHTML='<strong>Struktur:</strong> '+esc(q[7]);b.innerHTML='Hilfe 2';}else if(level===2){box.innerHTML='<strong>Denkfrage:</strong> '+esc(q[8]);b.innerHTML='Hilfe 3';}else{box.innerHTML='<strong>Erster Schritt:</strong> '+esc(q[9]);b.disabled=true;}}
function replace(){var q=round[pos],pool=bank.filter(function(x){return x[1]===q[1]&&x[0]!==q[0];});if(pool.length)round[pos]=pool[Math.floor(Math.random()*pool.length)];show();}function next(){pos++;if(pos>=round.length)finish();else show();}
function finish(){var result={},i,a,good='',practice='';fill.style.width='100%';for(i=0;i<answers.length;i++){a=answers[i];if(!result[a.skill])result[a.skill]={right:0,total:0};result[a.skill].total++;if(a.right)result[a.skill].right++;}for(i in result)if(result.hasOwnProperty(i)){if(result[i].right>=Math.ceil(result[i].total*.7))good+='<div class="item">'+esc(labels[i])+'</div>';else practice+='<div class="item">'+esc(labels[i])+'</div>';}if(!good)good='<div class="item">Du hast alle Aufgaben bearbeitet.</div>';if(!practice)practice='<div class="item">Keine Kompetenz ist in dieser Probe offen.</div>';card.innerHTML='<h1>Auswertung</h1><section class="summary"><h2>Das klappt schon gut</h2>'+good+'</section><section class="summary"><h2>Das übe ich noch</h2>'+practice+'</section><button class="main" id="again">Neue Variante</button><button class="help" id="menu">Zur Auswahl</button>';document.getElementById('again').addEventListener('click',function(){round=buildRound();pos=0;answers=[];show();});document.getElementById('menu').addEventListener('click',menu);}
function buildPrint(){var qs=buildRound(),html='<div class="print-page"><h1>Grüne Lola 4 · Übungsblatt 1</h1><p>Name: ____________________ Datum: __________</p><h2>Nomen, Verben und Zeitformen</h2>',i;for(i=0;i<qs.length;i++)html+='<div class="print-task"><strong>'+(i+1)+'. '+esc(labels[qs[i][1]])+'</strong><br>'+esc(qs[i][10])+'<span class="answer-line"></span></div>';html+='</div><div class="print-page"><h1>Lösungsblatt</h1>';for(i=0;i<qs.length;i++)html+='<div class="solution"><strong>'+(i+1)+'.</strong> '+esc(qs[i][11])+' <small>('+esc(labels[qs[i][1]])+')</small></div>';html+='</div>';document.getElementById('printSheet').innerHTML=html;}
