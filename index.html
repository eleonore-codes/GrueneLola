<!DOCTYPE html>
<html lang='de'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
    <title>Grüne Lola 3</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: 14px; background: #071f1a; color: #ffffff; font-family: Arial, Verdana, sans-serif; letter-spacing: 0.03em; display: flex; align-items: center; justify-content: center; }
        .stage { width: 100%; max-width: 520px; border: 2px solid #64f06f; border-radius: 8px; background: #123b2f; padding: 18px; box-shadow: 0 0 24px rgba(100,240,111,0.22); }
        h1 { margin: 0 0 8px 0; color: #64f06f; font-size: 28px; line-height: 1.15; text-align: center; }
        .sub { color: #dfffe5; font-size: 18px; text-align: center; line-height: 1.35; margin-bottom: 18px; }
        button { width: 100%; min-height: 64px; border: 2px solid #d7ff4f; border-radius: 8px; background: #1c5a45; color: #ffffff; font-size: 22px; font-weight: bold; padding: 12px; }
        button:active { background: #64f06f; color: #071f1a; }
    </style>
</head>
<body>
    <main class='stage'>
        <h1>Grüne Lola 3</h1>
        <div class='sub'>Satzzeichen-Arena für Klasse 3</div>
        <button type='button' onclick="window.location.href='klasse-3/index.html'">Klasse 3 starten</button>
    </main>
</body>
</html>
