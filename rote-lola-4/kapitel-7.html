var card=document.getElementById('card'),progressFill=document.getElementById('progressFill'),backBtn=document.getElementById('backBtn'),readBtn=document.getElementById('readBtn'),round=[],position=0,currentTask=null,attempts=0,helpLevel=0,answered=false,sessionStats={},reviewScheduled={},savedStats=load(STORAGE_KEY);
function load(key){try{var v=localStorage.getItem(key);return v?JSON.parse(v):{};}catch(e){return {};}}function save(key,v){try{localStorage.setItem(key,JSON.stringify(v));}catch(e){return;}}function shuffle(a){var c=a.slice(0),i,j,t;for(i=c.length-1;i>0;i-=1){j=Math.floor(Math.random()*(i+1));t=c[i];c[i]=c[j];c[j]=t;}return c;}function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}function stat(store,key){if(!store[key]){store[key]={attempts:0,direct:0,helped:0,uncertain:0,examples:{}};}return store[key];}function own(o){var k,n=0;for(k in o){if(o.hasOwnProperty(k)){n+=1;}}return n;}

function showTask(){var opts,i;currentTask=round[position];attempts=0;helpLevel=0;answered=false;progress();card.innerHTML='<div class="task-head"><div class="station-number">'+currentTask.station+'</div><div><div class="station-name">'+esc(currentTask.stationName)+'</div><div class="instruction">Aufgabe '+(position+1)+' von '+round.length+'</div></div></div><div class="question">'+esc(currentTask.question)+'</div><div class="focus">'+currentTask.display+'</div><div class="help-box" id="helpBox"></div><div class="options" id="optionsBox"></div><div class="feedback" id="feedbackBox"></div><div class="help-row"><button class="help-btn" id="helpBtn">Hilfe 1</button><button class="help-btn" id="newBtn">Andere Aufgabe</button></div><button class="main-btn" id="nextBtn" disabled>Weiter</button>';opts=shuffle(currentTask.options);for(i=0;i<opts.length;i+=1){makeOption(opts[i]);}document.getElementById('helpBtn').addEventListener('click',help);document.getElementById('newBtn').addEventListener('click',replace);document.getElementById('nextBtn').addEventListener('click',next);}function makeOption(v){var b=document.createElement('button');b.className='option';b.setAttribute('data-value',v);b.innerHTML=esc(v);b.addEventListener('click',choose);document.getElementById('optionsBox').appendChild(b);}
function choose(e){var b=e.currentTarget,v=b.getAttribute('data-value'),fb=document.getElementById('feedbackBox'),all,i,s;if(answered){return;}attempts+=1;if(v===currentTask.answer){answered=true;b.className+=' correct';s=stat(sessionStats,currentTask.competency);s.attempts+=1;if(attempts===1&&helpLevel===0){s.direct+=1;s.examples[currentTask.id]=true;fb.innerHTML='Richtig. '+esc(competencies[currentTask.competency])+' klappt hier.';}else{s.helped+=1;fb.innerHTML='Geschafft. Richtig ist: <strong>'+esc(currentTask.answer)+'</strong>';}schedule();all=document.getElementById('optionsBox').getElementsByTagName('button');for(i=0;i<all.length;i+=1){all[i].disabled=true;}document.getElementById('nextBtn').disabled=false;document.getElementById('helpBtn').disabled=true;}else{b.className+=' wrong';b.disabled=true;fb.innerHTML='Noch nicht. Nutze eine Hilfe oder tippe eine andere Kachel.';if(attempts>=2){stat(sessionStats,currentTask.competency).uncertain+=1;}}}

}());
