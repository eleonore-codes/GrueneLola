<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rote Lola 4 · Lernportionen</title>
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body { margin: 0; padding: 14px 12px 28px 12px; background: #2a1116; color: #f7efe1; font-family: Arial, Verdana, sans-serif; letter-spacing: 0.02em; }
        .wrap { width: 100%; max-width: 540px; margin: 0 auto; }
        header { padding: 8px 4px 18px 4px; text-align: center; }
        .eyebrow { color: #d2ae62; font-size: 14px; font-weight: bold; letter-spacing: 0.12em; text-transform: uppercase; }
        h1 { margin: 6px 0 5px 0; font-size: 28px; line-height: 1.15; }
        .intro { margin: 0; color: #ead4ca; font-size: 17px; line-height: 1.45; }
        .panel { margin-bottom: 16px; padding: 14px; border: 2px solid rgba(210,174,98,0.82); border-radius: 8px; background: #482027; box-shadow: 0 12px 28px rgba(0,0,0,0.24); }
        h2 { margin: 0 0 11px 0; color: #d2ae62; font-size: 18px; }
        .grid { display: grid; gap: 10px; }
        .tile { width: 100%; min-height: 68px; padding: 12px 13px; border: 2px solid rgba(247,239,225,0.22); border-radius: 8px; background: #7d303a; color: #f7efe1; font: inherit; text-align: left; display: flex; align-items: center; gap: 12px; }
        .tile.active { border-color: #d2ae62; cursor: pointer; }
        .tile.active:active { background: #c98f91; color: #2a1116; }
        .tile.locked { opacity: 0.58; }
        .number { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #2a1116; color: #d2ae62; font-size: 21px; font-weight: bold; }
        .tile-text { flex: 1; min-width: 0; }
        .tile-title { display: block; font-size: 18px; font-weight: bold; line-height: 1.2; }
        .tile-sub { display: block; margin-top: 4px; color: #ead4ca; font-size: 14px; line-height: 1.3; }
        .badge { flex: 0 0 auto; padding: 5px 8px; border-radius: 8px; background: rgba(42,17,22,0.72); color: #d2ae62; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .back { display: block; min-height: 48px; padding: 13px; border: 1px solid #d2ae62; border-radius: 8px; color: #f7efe1; text-align: center; text-decoration: none; font-size: 17px; font-weight: bold; }
        @media (max-width: 370px) { .tile { gap: 9px; padding: 10px; } .tile-title { font-size: 17px; } .badge { font-size: 11px; } }
    </style>
</head>
<body>
    <div class="wrap">
        <header><div class="eyebrow">Rote Lola</div><h1>Klasse 4</h1><p class="intro">Wähle eine kleine Lernportion.</p></header>
        <main>
            <section class="panel" aria-labelledby="learningTitle">
                <h2 id="learningTitle">Lernportionen</h2>
                <div class="grid">
                    <button class="tile active" id="chapter1Btn" type="button"><span class="number">1</span><span class="tile-text"><span class="tile-title">Im Wörterbuch nachschlagen</span><span class="tile-sub">Alphabet, Nomen, Verben und Fremdwörter</span></span><span class="badge">Start</span></button>
                    <button class="tile active" id="chapter2Btn" type="button"><span class="number">2</span><span class="tile-text"><span class="tile-title">Mit Silben arbeiten</span><span class="tile-sub">Silbenkerne erkennen und Wörter sicher trennen</span></span><span class="badge">Start</span></button>
                    <button class="tile active" id="chapter3Btn" type="button"><span class="number">3</span><span class="tile-text"><span class="tile-title">Merkwörter</span><span class="tile-sub">ai, Dehnungs-h, kleine Wörter und Y/y</span></span><span class="badge">Start</span></button>
                    <button class="tile active" id="chapter4Btn" type="button"><span class="number">4</span><span class="tile-text"><span class="tile-title">Ableiten und verlängern</span><span class="tile-sub">ä/äu ableiten, Wortenden und silbentrennendes h</span></span><span class="badge">Start</span></button>
                    <button class="tile active" id="chapter5Btn" type="button"><span class="number">5</span><span class="tile-text"><span class="tile-title">Groß- und Kleinschreibung</span><span class="tile-sub">Zeitangaben, substantivierte Verben und Eigennamen</span></span><span class="badge">Start</span></button>
                    <button class="tile locked" type="button" disabled><span class="number">6</span><span class="tile-text"><span class="tile-title">Kurze und lange Selbstlaute</span><span class="tile-sub">Seiten 45–52</span></span><span class="badge">Später</span></button>
                    <button class="tile locked" type="button" disabled><span class="number">7</span><span class="tile-text"><span class="tile-title">s-Laute</span><span class="tile-sub">Seiten 53–58</span></span><span class="badge">Später</span></button>
                    <button class="tile locked" type="button" disabled><span class="number">8</span><span class="tile-text"><span class="tile-title">Rechtschreibstrategien anwenden</span><span class="tile-sub">Seiten 59–66</span></span><span class="badge">Später</span></button>
                </div>
            </section>
            <a class="back" href="../index.html">Zur Klassen-Auswahl</a>
        </main>
    </div>
    <script>
    (function () {
        var chapter1Btn = document.getElementById('chapter1Btn');
        var chapter2Btn = document.getElementById('chapter2Btn');
        var chapter3Btn = document.getElementById('chapter3Btn');
        var chapter4Btn = document.getElementById('chapter4Btn');
        var chapter5Btn = document.getElementById('chapter5Btn');
        chapter1Btn.addEventListener('click', function () { window.location.href = 'kapitel-1.html'; });
        chapter2Btn.addEventListener('click', function () { window.location.href = 'kapitel-2.html'; });
        chapter3Btn.addEventListener('click', function () { window.location.href = 'kapitel-3.html'; });
        chapter4Btn.addEventListener('click', function () { window.location.href = 'kapitel-4.html'; });
        chapter5Btn.addEventListener('click', function () { window.location.href = 'kapitel-5.html'; });
    }());
    </script>
</body>
</html>
