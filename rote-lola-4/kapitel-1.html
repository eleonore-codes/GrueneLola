var card=document.getElementById('card');var progressFill=document.getElementById('progressFill');var backBtn=document.getElementById('backBtn');var readBtn=document.getElementById('readBtn');var round=[];var position=0;var currentTask=null;var attemptsThisTask=0;var helpLevel=0;var answered=false;var sessionStats={};var reviewScheduled={};var savedStats=loadObject(STORAGE_KEY);
function loadObject(key){try{var value=window.localStorage.getItem(key);return value?JSON.parse(value):{};}catch(error){return {};}}
function saveObject(key,value){try{window.localStorage.setItem(key,JSON.stringify(value));}catch(error){return;}}
function shuffle(list){var copy=list.slice(0);var i;var j;var temp;for(i=copy.length-1;i>0;i-=1){j=Math.floor(Math.random()*(i+1));temp=copy[i];copy[i]=copy[j];copy[j]=temp;}return copy;}
function escapeHtml(value){return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getStat(store,key){if(!store[key]){store[key]={attempts:0,direct:0,afterError:0,helped:0,uncertain:0,examples:{},lastWorked:''};}if(!store[key].examples){store[key].examples={};}return store[key];}
function countOwn(object){var key;var count=0;for(key in object){if(object.hasOwnProperty(key)){count+=1;}}return count;}
function startScreen(){progressFill.style.width='0%';card.innerHTML='<h1 class="start-title">Wörterbuch-Werkstatt</h1><p class="lead">Erst orientieren. Dann die Nachschlagform finden. Zum Schluss die Strategie wählen.</p><div class="mode-grid"><button class="mode-btn" data-size="7" type="button">Kurze Runde<small>7 kleine Aufgaben</small></button><button class="mode-btn" data-size="14" type="button">Normale Runde<small>jede Station zweimal</small></button><button class="mode-btn" data-size="21" type="button">Meisterrunde<small>21 gemischte Aufgaben</small></button></div><div class="station-list"><strong>7 Stationen</strong><br>Alphabet-Weg · Wörterbuch-Wissen · Nomen-Lupe · Grundform-Finder · Wortfamilien · Fremdwort-Kompass · Nachschlag-Plan</div>';bindModes();}
function bindModes(){var buttons=card.getElementsByTagName('button');var i;for(i=0;i<buttons.length;i+=1){if(buttons[i].getAttribute('data-size')){buttons[i].addEventListener('click',startRound);}}}

function updateProgress(){progressFill.style.width=Math.round((position/round.length)*100)+'%';}
function makeOption(text){var button=document.createElement('button');button.type='button';button.className='option';button.setAttribute('data-value',text);button.innerHTML=escapeHtml(text);button.addEventListener('click',choose);document.getElementById('optionsBox').appendChild(button);}

function scheduleReview(){var alternatives=[];var i;if((attemptsThisTask<2&&helpLevel<3)||reviewScheduled[currentTask.competency]){return;}for(i=0;i<tasks.length;i+=1){if(tasks[i].competency===currentTask.competency&&tasks[i].id!==currentTask.id){alternatives.push(tasks[i]);}}if(alternatives.length){round.splice(Math.min(position+2,round.length),0,alternatives[Math.floor(Math.random()*alternatives.length)]);reviewScheduled[currentTask.competency]=true;}}
function showHelp(){var box=document.getElementById('helpBox');var button=document.getElementById('helpBtn');helpLevel+=1;box.className='help-box show';if(helpLevel===1){box.innerHTML='<strong>Struktur:</strong> '+escapeHtml(currentTask.help1);button.innerHTML='Hilfe 2';}else if(helpLevel===2){box.innerHTML='<strong>Denkfrage:</strong> '+escapeHtml(currentTask.help2);button.innerHTML='Hilfe 3';}else{helpLevel=3;box.innerHTML='<strong>Erster Schritt:</strong> '+escapeHtml(currentTask.help3);button.disabled=true;scheduleReview();}}
function replaceTask(){var alternatives=[];var i;for(i=0;i<tasks.length;i+=1){if(tasks[i].competency===currentTask.competency&&tasks[i].id!==currentTask.id){alternatives.push(tasks[i]);}}if(alternatives.length){round[position]=alternatives[Math.floor(Math.random()*alternatives.length)];}showTask();}
function nextTask(){position+=1;if(position>=round.length){finishRound();}else{showTask();}}
function mergeStats(){var key;var example;var source;var target;for(key in sessionStats){if(sessionStats.hasOwnProperty(key)){source=sessionStats[key];target=getStat(savedStats,key);target.attempts+=source.attempts;target.direct+=source.direct;target.afterError+=source.afterError;target.helped+=source.helped;target.uncertain+=source.uncertain;for(example in source.examples){if(source.examples.hasOwnProperty(example)){target.examples[example]=true;}}target.lastWorked=source.lastWorked;}}saveObject(STORAGE_KEY,savedStats);}
function finishRound(){var good='';var practice='';var key;var stat;mergeStats();progressFill.style.width='100%';for(key in sessionStats){if(sessionStats.hasOwnProperty(key)){stat=getStat(savedStats,key);if(stat.direct>=2&&countOwn(stat.examples)>=2&&stat.uncertain<2){good+='<div class="summary-item">'+escapeHtml(competencies[key])+'</div>';}else{practice+='<div class="summary-item">'+escapeHtml(competencies[key])+'</div>';}}}if(!good){good='<div class="summary-item">Du hast die Runde ruhig zu Ende gebracht.</div>';}if(!practice){practice='<div class="summary-item">In dieser Runde ist keine Kompetenz offen.</div>';}card.innerHTML='<h1 class="final-title">Runde geschafft</h1><p class="lead">Dein Lernweg wird nach Kompetenzen geordnet.</p><section class="summary-group"><h2>Das klappt schon gut</h2>'+good+'</section><section class="summary-group"><h2>Das übe ich noch</h2>'+practice+'</section><p class="saved-note">Der Lernstand bleibt nur auf diesem Gerät.</p><button class="main-btn" id="repeatBtn" type="button">Neue gemischte Runde</button><button class="help-btn" id="menuBtn" type="button">Zur Kapitel-Auswahl</button>';document.getElementById('repeatBtn').addEventListener('click',startScreen);document.getElementById('menuBtn').addEventListener('click',function(){window.location.href='index.html';});}

backBtn.addEventListener('click',function(){window.location.href='index.html';});readBtn.addEventListener('click',function(){setReading(readBtn.getAttribute('aria-pressed')!=='true');});setReading(loadObject(READING_KEY).enabled===true);startScreen();
