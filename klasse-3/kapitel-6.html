<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grüne Lola - Kapitel 6</title>
    <style>
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body { margin: 0; background: #0f241d; color: #f6f1e6; font-family: Arial, Verdana, sans-serif; letter-spacing: 0.03em; user-select: none; -webkit-user-select: none; }
        .arena { min-height: 100vh; display: flex; flex-direction: column; padding: 12px; background: radial-gradient(circle at 50% 0%, rgba(214,176,76,0.14), rgba(15,36,29,0) 34%), linear-gradient(180deg, #17382d 0%, #0f241d 62%); }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; max-width: 540px; width: 100%; margin: 0 auto 10px auto; }
        .nav-back { min-width: 78px; min-height: 44px; border: 1px solid #d6b04c; background: rgba(15,36,29,0.82); color: #f6f1e6; border-radius: 8px; font-size: 15px; font-weight: bold; }
        .title { flex: 1; min-width: 0; text-align: center; color: #f6f1e6; font-size: 18px; font-weight: bold; text-transform: uppercase; }
        .score { min-width: 78px; text-align: right; color: #f6f1e6; font-weight: bold; font-size: 15px; }
        .progress-track { max-width: 540px; width: 100%; height: 13px; border-radius: 999px; overflow: hidden; margin: 0 auto 12px auto; background: #28473b; border: 1px solid rgba(246,241,230,0.18); }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #d6b04c, #6fbf73); }
        .card { max-width: 540px; width: 100%; margin: 0 auto; background: #17382d; border: 2px solid rgba(214,176,76,0.82); border-radius: 8px; padding: 15px; box-shadow: 0 12px 30px rgba(0,0,0,0.28); }
        .mode-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .mode-icon { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0f241d; background: #d6b04c; font-size: 28px; font-weight: bold; border: 3px solid #f6f1e6; flex: 0 0 auto; letter-spacing: 0; }
        .mode-text { flex: 1; min-width: 0; }
        .mode-label { color: #d6b04c; font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 3px; }
        .hint { color: #f6f1e6; font-size: 16px; line-height: 1.35; }
        .task { font-size: 22px; line-height: 1.3; font-weight: bold; margin: 10px 0 12px 0; }
        .sentence { background: #0f241d; border: 2px dashed #d6b04c; border-radius: 8px; min-height: 106px; padding: 14px; display: flex; align-items: center; justify-content: center; text-align: center; color: #f6f1e6; font-size: 27px; font-weight: bold; line-height: 1.25; margin-bottom: 12px; overflow-wrap: anywhere; }
        .quote-mark { display: inline-block; min-width: 0.92em; margin: 0 0.04em; border-radius: 7px; color: #0f241d; background: #d6b04c; padding: 0.02em 0.18em 0.12em 0.18em; line-height: 1; }
        .speaker { color: #d6b04c; text-decoration: underline; text-decoration-thickness: 3px; }
        .bubble { display: inline-block; border: 3px solid #f6f1e6; border-radius: 24px; padding: 12px 15px; background: #f6f1e6; color: #0f241d; box-shadow: 0 6px 0 rgba(0,0,0,0.18); }
        .options { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .options.symbols { grid-template-columns: repeat(2, 1fr); }
        .option { width: 100%; min-height: 60px; border: 2px solid rgba(246,241,230,0.24); border-radius: 8px; background: #225443; color: #f6f1e6; padding: 12px; font-size: 22px; font-weight: bold; line-height: 1.18; text-align: center; }
        .symbols .option { min-height: 82px; font-size: 36px; letter-spacing: 0; background: #0f241d; border-color: #d6b04c; }
        .option:active { transform: scale(0.99); }
        .option.correct { background: #6fbf73; color: #0f241d; border-color: #f6f1e6; }
        .option.wrong { background: #8d2430; color: #ffffff; border-color: #ffc3ca; }
        .feedback { min-height: 46px; margin-top: 12px; color: #f6f1e6; font-size: 17px; line-height: 1.35; font-weight: bold; text-align: center; }
        .next-btn, .restart-btn, .link-btn { width: 100%; min-height: 56px; border: 0; border-radius: 8px; padding: 12px; font-size: 19px; font-weight: bold; margin-top: 10px; background: #6fbf73; color: #0f241d; }
        .link-btn { background: #d6b04c; }
        .next-btn[disabled] { opacity: 0.42; }
        .final-title { color: #d6b04c; font-size: 25px; font-weight: bold; text-align: center; margin: 4px 0 10px 0; }
        .final-score { background: #0f241d; border: 2px solid rgba(214,176,76,0.78); border-radius: 8px; padding: 14px; text-align: center; font-size: 20px; font-weight: bold; line-height: 1.45; margin-bottom: 12px; }
        .review-list { display: grid; gap: 8px; margin-top: 10px; }
        .review-item { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 10px; font-size: 16px; line-height: 1.35; }
        @media (max-width: 390px) { .sentence { font-size: 24px; } .option { font-size: 20px; } .symbols .option { font-size: 32px; } .task { font-size: 20px; } .hint { font-size: 15px; } }
    </style>
</head>
<body>
    <div class="arena">
        <div class="topbar">
            <button class="nav-back" id="backBtn" type="button">Zurück</button>
            <div class="title">Kapitel 6</div>
            <div class="score" id="scoreBox">0 / 12</div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <main class="card" id="card">
            <div class="mode-row">
                <div class="mode-icon" id="modeIcon">"</div>
                <div class="mode-text">
                    <div class="mode-label" id="modeLabel">Wörtliche Rede</div>
                    <div class="hint" id="hintText">Redezeichen zeigen, wer genau spricht.</div>
                </div>
            </div>
            <div class="task" id="taskText"></div>
            <div class="sentence" id="sentenceText"></div>
            <div class="options" id="optionsBox"></div>
            <div class="feedback" id="feedbackBox"></div>
            <button class="next-btn" id="nextBtn" type="button" disabled>Weiter</button>
        </main>
    </div>
<script>
(function () {
    var tasks = [
        { icon: '"', label: 'Redezeichen', hint: 'Was jemand sagt, steht zwischen Redezeichen.', task: 'Welche Zeichen gehören um die wörtliche Rede?', sentence: '<span>Marie ruft: <span class="bubble">Das war ein Tor!</span></span>', optionsClass: 'symbols', options: ['"  "', ':  .', '?  !', ',  ,'], answer: '"  "', ok: 'Genau: Vor und nach der Rede stehen Redezeichen.', no: 'Fast. Die Rede braucht vorne und hinten Redezeichen.' },
        { icon: ':', label: 'Doppelpunkt', hint: 'Nach dem Redebegleitsatz steht ein Doppelpunkt.', task: 'Wo steht der Doppelpunkt richtig?', sentence: '<span class="speaker">Marie</span> ruft ... <span class="quote-mark">"</span>Das war ein Tor!<span class="quote-mark">"</span>', options: ['Marie ruft: "Das war ein Tor!"', 'Marie: ruft "Das war ein Tor!"', 'Marie ruft "Das war: ein Tor!"', ': Marie ruft "Das war ein Tor!"'], answer: 'Marie ruft: "Das war ein Tor!"', ok: 'Richtig. Erst der Begleitsatz, dann der Doppelpunkt, dann die Rede.', no: 'Der Doppelpunkt steht direkt vor der Rede.' },
        { icon: '?', label: 'Wer spricht?', hint: 'Suche den Namen vor dem Sprechverb.', task: 'Wer sagt diesen Satz?', sentence: '<span class="speaker">David</span> fragt: <span class="quote-mark">"</span>Würden Sie den Hund mal streicheln?<span class="quote-mark">"</span>', options: ['David', 'Frau', 'Hund', 'Henne'], answer: 'David', ok: 'Ja. David fragt.', no: 'Schau links vor das Wort fragt.' },
        { icon: 'V', label: 'Sprechverb', hint: 'Das Verb sagt, wie gesprochen wird.', task: 'Welches Sprechverb passt?', sentence: '<span class="speaker">Frau</span> ___: <span class="quote-mark">"</span>Aber gern.<span class="quote-mark">"</span>', options: ['antwortet', 'brüllte', 'meckert', 'stottert'], answer: 'antwortet', ok: 'Genau: Auf eine Frage antwortet man.', no: 'Hier reagiert die Frau auf Davids Frage.' },
        { icon: '!', label: 'Gefühl hören', hint: 'Das Sprechverb passt zur Stimmung.', task: 'Welches Verb passt zur Sprechblase?', sentence: '<span class="bubble">Foul, du hast mich gestoppt!</span>', options: ['protestiert', 'flüsterte', 'denkt', 'erklärt'], answer: 'protestiert', ok: 'Stark. Bei einem Foul protestiert man oft.', no: 'Die Sprechblase klingt ärgerlich und laut.' },
        { icon: '"', label: 'Rede erkennen', hint: 'Die Rede ist das, was genau gesagt wird.', task: 'Was ist die wörtliche Rede?', sentence: 'Mia fragt: <span class="quote-mark">"</span>Was ist passiert?<span class="quote-mark">"</span>', options: ['Was ist passiert?', 'Mia fragt', 'fragt', 'Mia'], answer: 'Was ist passiert?', ok: 'Richtig. Nur dieser Teil steht in Redezeichen.', no: 'Die wörtliche Rede steht zwischen den Zeichen.' },
        { icon: ':', label: 'Begleitsatz', hint: 'Der Begleitsatz sagt, wer spricht.', task: 'Was ist der Redebegleitsatz?', sentence: '<span class="speaker">Uli</span> schreit: <span class="quote-mark">"</span>He, das war mein Ball!<span class="quote-mark">"</span>', options: ['Uli schreit:', 'He, das war mein Ball!', 'mein Ball', 'war mein'], answer: 'Uli schreit:', ok: 'Ja. Der Begleitsatz nennt Sprecher und Sprechverb.', no: 'Der Begleitsatz steht vor der Rede.' },
        { icon: 'S', label: 'Sprecher finden', hint: 'Namen und Trikots helfen beim Sortieren.', task: 'Wer ruft hier?', sentence: '<span class="speaker">Mika</span> ruft: <span class="quote-mark">"</span>Das ist meine Chance.<span class="quote-mark">"</span>', options: ['Mika', 'Niko', 'Lea', 'Tarik'], answer: 'Mika', ok: 'Richtig. Mika ruft den Satz.', no: 'Der Name steht direkt vor ruft.' },
        { icon: 'V', label: 'Leise oder laut', hint: 'Flüstern ist leise. Brüllen ist laut.', task: 'Welches Verb passt am besten?', sentence: '<span class="bubble">Psst, ich lese den anderen Spatz.</span>', options: ['flüstert', 'brüllt', 'prahlt', 'meckert'], answer: 'flüstert', ok: 'Genau. Psst passt zu flüstert.', no: 'Psst ist ein Signal für leises Sprechen.' },
        { icon: 'E', label: 'Englische Wörter', hint: 'Mug und Leo benutzen englische Wörter.', task: 'Welches Wort passt zu "leicht"?', sentence: '<span class="bubble">Leicht fand ich, dass ...</span>', options: ['easy', 'happy', 'cool', 'checken'], answer: 'easy', ok: 'Ja. Easy bedeutet leicht.', no: 'Gesucht ist das englische Wort für leicht.' },
        { icon: '?', label: 'Fragesatz in Rede', hint: 'Eine Frage in der Rede endet mit Fragezeichen.', task: 'Welcher Satz ist richtig geschrieben?', sentence: '<span class="speaker">Leo</span> fragt ...', options: ['Leo fragt: "Was machen wir?"', 'Leo fragt: "Was machen wir."', 'Leo fragt "Was machen wir?"', 'Leo fragt: Was machen wir?'], answer: 'Leo fragt: "Was machen wir?"', ok: 'Richtig: Doppelpunkt, Redezeichen und Fragezeichen passen.', no: 'Achte auf Doppelpunkt, Redezeichen und Fragezeichen.' },
        { icon: 'M', label: 'Mug und Leo', hint: 'Der Begleitsatz kann auch am Anfang stehen.', task: 'Welcher Begleitsatz passt?', sentence: '<span class="bubble">Wenn wir zwei Coole sind, dann schauen wir Filme an.</span>', options: ['Leo erklärt:', 'Leo fragt:', 'Leo flüstert:', 'Leo stottert:'], answer: 'Leo erklärt:', ok: 'Sehr gut. Leo erklärt, was Coole machen.', no: 'Der Satz klingt wie eine Erklärung.' }
    ];
    var order = [];
    var current = 0;
    var score = 0;
    var wrong = [];
    var chosen = false;
    var els = {};
    function byId(id) { return document.getElementById(id); }
    function shuffle(list) {
        var i;
        var j;
        var temp;
        for (i = list.length - 1; i > 0; i -= 1) {
            j = Math.floor(Math.random() * (i + 1));
            temp = list[i];
            list[i] = list[j];
            list[j] = temp;
        }
        return list;
    }
    function makeOrder() {
        var i;
        order = [];
        for (i = 0; i < tasks.length; i += 1) { order.push(i); }
        shuffle(order);
    }
    function setProgress() {
        els.scoreBox.innerHTML = current + ' / ' + tasks.length;
        els.progressFill.style.width = Math.round((current / tasks.length) * 100) + '%';
    }
    function clearOptions() {
        while (els.optionsBox.firstChild) { els.optionsBox.removeChild(els.optionsBox.firstChild); }
    }
    function makeOption(text, answer, task) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option';
        btn.innerHTML = text;
        btn.onclick = function () { choose(btn, text, answer, task); };
        els.optionsBox.appendChild(btn);
    }
    function choose(btn, text, answer, task) {
        var buttons;
        var i;
        if (chosen) { return; }
        chosen = true;
        buttons = els.optionsBox.getElementsByTagName('button');
        for (i = 0; i < buttons.length; i += 1) {
            buttons[i].disabled = true;
            if (buttons[i].innerHTML === answer) { buttons[i].className += ' correct'; }
        }
        if (text === answer) {
            score += 1;
            btn.className += ' correct';
            els.feedbackBox.innerHTML = task.ok;
        } else {
            btn.className += ' wrong';
            els.feedbackBox.innerHTML = task.no;
            wrong.push({ task: task.task, answer: answer });
        }
        els.nextBtn.disabled = false;
    }
    function renderTask() {
        var task;
        var opts;
        var i;
        chosen = false;
        task = tasks[order[current]];
        els.modeIcon.innerHTML = task.icon;
        els.modeLabel.innerHTML = task.label;
        els.hintText.innerHTML = task.hint;
        els.taskText.innerHTML = task.task;
        els.sentenceText.innerHTML = task.sentence;
        els.feedbackBox.innerHTML = '';
        els.nextBtn.disabled = true;
        clearOptions();
        els.optionsBox.className = 'options';
        if (task.optionsClass) { els.optionsBox.className += ' ' + task.optionsClass; }
        opts = task.options.slice(0);
        shuffle(opts);
        for (i = 0; i < opts.length; i += 1) { makeOption(opts[i], task.answer, task); }
        setProgress();
    }
    function showFinal() {
        var html;
        var i;
        els.progressFill.style.width = '100%';
        els.scoreBox.innerHTML = score + ' / ' + tasks.length;
        html = '<div class="final-title">Training geschafft!</div>';
        html += '<div class="final-score">Du hast ' + score + ' von ' + tasks.length + ' Punkten geholt.<br>';
        if (score >= 10) { html += 'Sehr sicher bei der wörtlichen Rede.'; }
        else if (score >= 7) { html += 'Gute Runde. Ein paar Zeichen nochmal anschauen.'; }
        else { html += 'Weiter üben: Redezeichen und Doppelpunkt zuerst suchen.'; }
        html += '</div>';
        if (wrong.length > 0) {
            html += '<div class="review-list">';
            for (i = 0; i < wrong.length; i += 1) {
                html += '<div class="review-item"><strong>Noch einmal:</strong><br>' + wrong[i].task + '<br><strong>Richtig:</strong> ' + wrong[i].answer + '</div>';
            }
            html += '</div>';
        }
        html += '<button class="restart-btn" id="restartBtn" type="button">Nochmal spielen</button>';
        html += '<button class="link-btn" id="menuBtn" type="button">Zum Turnierbaum</button>';
        els.card.innerHTML = html;
        byId('restartBtn').onclick = function () { window.location.reload(); };
        byId('menuBtn').onclick = function () { window.location.href = 'index.html'; };
    }
    function next() {
        current += 1;
        if (current >= tasks.length) { showFinal(); }
        else { renderTask(); }
    }
    function init() {
        els.backBtn = byId('backBtn');
        els.scoreBox = byId('scoreBox');
        els.progressFill = byId('progressFill');
        els.card = byId('card');
        els.modeIcon = byId('modeIcon');
        els.modeLabel = byId('modeLabel');
        els.hintText = byId('hintText');
        els.taskText = byId('taskText');
        els.sentenceText = byId('sentenceText');
        els.optionsBox = byId('optionsBox');
        els.feedbackBox = byId('feedbackBox');
        els.nextBtn = byId('nextBtn');
        els.backBtn.onclick = function () { window.location.href = 'index.html'; };
        els.nextBtn.onclick = next;
        makeOrder();
        renderTask();
    }
    init();
}());
</script>
</body>
</html>
